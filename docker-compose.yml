version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: corruptintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: corruptintel
      POSTGRES_PASSWORD: corruptintel_dev_password
      POSTGRES_DB: corruptintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corruptintel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: corruptintel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: corruptintel_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: corruptintel_dev
      MINIO_ROOT_PASSWORD: corruptintel_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: corruptintel_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: corruptintel_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: corruptintel_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web

volumes:
  postgres_data:
  redis_data:
  minio_data:
